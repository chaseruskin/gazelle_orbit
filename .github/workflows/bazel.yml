name: Bazel
on:
  workflow_call:

jobs:
  bazel:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-bazel
          repository-cache: true

      # Build everything in the root module — the orbit_cli Rust binary,
      # the Go gazelle plugin, and the bundled gazelle_orbit executable.
      - name: Build root workspace
        run: bazel test //...

      # Run gazelle on the example. Then `git diff --exit-code` validates
      # that the generated BUILD files match what's committed, catching
      # any drift between the plugin and the example.
      - name: Run gazelle on the example workspace
        working-directory: examples
        run: bazel run //:gazelle

      - name: Verify gazelle output matches committed BUILDs
        working-directory: examples
        run: git diff --exit-code -- '**/BUILD.bazel' '**/Orbit.lock'

      # Build the gazelle-generated targets end-to-end. This exercises
      # rules_vhdl, rules_verilog, and rules_systemrdl (via the toolchain
      # set up in //tools/toolchains).
      - name: Build example targets
        working-directory: examples
        run: bazel build //...
